# Release
#
# Manual job only -- never runs automatically off a plain branch push. The three
# `rules:` clauses below are the mainline/patch/pre-release trigger contexts;
# each sets RELEASE_TRIGGER so the script passes the right --trigger value
# instead of relying on prepare_release.dart's own branch auto-detection
# (which doesn't know about the pre-release whitelist).
#
# Pre-release branches are a manually-maintained whitelist here, not a
# pattern match -- add/remove an `if:` clause per active effort (see `v4`
# below). Keep in sync with .github/chainguard/self.prepare-release.sts.yaml's
# subject_pattern, which grants this job's GitHub token and is scoped to the
# same branch set.
prepare-release:
  stage: prepare-release
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      variables:
        RELEASE_TRIGGER: "mainline"
    - if: '$CI_COMMIT_BRANCH =~ /^release\/.+\/v\d+\.\d+\.x$/'
      when: manual
      variables:
        RELEASE_TRIGGER: "patch"
    - if: '$CI_COMMIT_BRANCH == "v4"' # pre-release whitelist -- see comment above
      when: manual
      variables:
        RELEASE_TRIGGER: "prerelease"
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
    PACKAGES: ""
    IOS_SDK_VERSION: ""
    ANDROID_SDK_VERSION: ""
    CPP_VERSION: ""
    BUMP_TYPE: ""
    PRERELEASE_LABEL: ""
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  tags:
    - macos:sequoia
    - specific:true
  before_script:
    # We need a short-lived GitHub token to push commits and open PRs; see
    # .github/chainguard/self.prepare-release.sts.yaml.
    - dd-octo-sts --disable-tracing debug --scope DataDog/dd-sdk-flutter --policy self.prepare-release
    - dd-octo-sts --disable-tracing token --scope DataDog/dd-sdk-flutter --policy self.prepare-release > /tmp/gh-token.txt
  script:
    - !reference [.pre, script]
    # The `gh` CLI (github_cmd_wrapper.dart) picks up GITHUB_TOKEN automatically;
    # for `git` push/PR-base operations we point origin at GitHub using the same
    # token, and configure the dd-octo-sts bot identity for the release commits.
    - export GITHUB_TOKEN=$(cat /tmp/gh-token.txt)
    - git config user.name "dd-octo-sts[bot]"
    - git config user.email "200755185+dd-octo-sts[bot]@users.noreply.github.com"
    - git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/DataDog/dd-sdk-flutter.git"
    # This repo requires signed commits (see CONTRIBUTING.md), so the
    # release-prep commits need commit-headless too.
    - commit-headless version
    # AI Gateway token for LLM changelog generation, via authanywhere;
    # ai_gateway.dart reads this env var directly (see
    # HttpAiGatewayClient.fromEnvironment).
    - export AI_GATEWAY_TOKEN=$(authanywhere --audience rapid-ai-platform --raw --dc us1.ddbuild.io)
    - pushd tools/releaser && dart pub get && popd
    - >
      dart run tools/releaser/bin/prepare_release.dart
      --repo-root=$CI_PROJECT_DIR
      --trigger=$RELEASE_TRIGGER
      ${PACKAGES:+--packages=$PACKAGES}
      ${BUMP_TYPE:+--bump-type=$BUMP_TYPE}
      ${IOS_SDK_VERSION:+--ios-sdk-version=$IOS_SDK_VERSION}
      ${ANDROID_SDK_VERSION:+--android-sdk-version=$ANDROID_SDK_VERSION}
      ${CPP_VERSION:+--cpp-version=$CPP_VERSION}
      ${PRERELEASE_LABEL:+--prerelease-label=$PRERELEASE_LABEL}
  after_script:
    # Revoke the dd-octo-sts-provided GitHub token unconditionally once finished.
    - dd-octo-sts --disable-tracing revoke --token "$(cat /tmp/gh-token.txt)"

# Phase 2 trigger
#
# Pushes the `release-trigger/*` tag that GitHub Actions' publish-release.yml
# watches for -- only after this exact commit's pipeline has already
# succeeded 
#
# Pre-release `-main` branches are a manually-maintained whitelist, same discipline as 
# prepare-release's `v4` whitelist above. 
push-release-trigger-tag:
  stage: release-trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "v4-main" || $CI_COMMIT_BRANCH =~ /^release\/.+\/v\d+\.\d+\.x$/)'
      changes:
        - ".release/manifest.json"
  # Same runner as prepare-release as 
  # dd-octo-sts/git/gh all need to be present
  tags:
    - macos:sequoia
    - specific:true
  id_tokens:
    DDOCTOSTS_ID_TOKEN:
      aud: dd-octo-sts
  before_script:
    # Narrower scope than prepare-release's policy -- tag-push only, never
    # PR/branch. See .github/chainguard/self.tag-push.sts.yaml.
    - dd-octo-sts --disable-tracing debug --scope DataDog/dd-sdk-flutter --policy self.tag-push
    - dd-octo-sts --disable-tracing token --scope DataDog/dd-sdk-flutter --policy self.tag-push > /tmp/gh-token.txt
  script:
    - export GITHUB_TOKEN=$(cat /tmp/gh-token.txt)
    - git config user.name "dd-octo-sts[bot]"
    - git config user.email "200755185+dd-octo-sts[bot]@users.noreply.github.com"
    - git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/DataDog/dd-sdk-flutter.git"
    - TAG_NAME="release-trigger/$(date -u +%Y-%m-%d)-${CI_COMMIT_SHORT_SHA}"
    - git tag -a -m "$TAG_NAME" "$TAG_NAME" "$CI_COMMIT_SHA"
    - git push origin "$TAG_NAME"
  after_script:
    - dd-octo-sts --disable-tracing revoke --token "$(cat /tmp/gh-token.txt)"

# Notify

notify-publish-develop-failure:
  extends: .slack-notifier-base
  stage: post
  when: on_failure
  only:
    - develop
  script:
    - BUILD_URL="$CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID"
    - 'MESSAGE_TEXT=":status_alert: $CI_PROJECT_NAME $CI_COMMIT_TAG develop pipeline <$BUILD_URL|$COMMIT_MESSAGE> failed."'
    - postmessage "#mobile-sdk-ops" "$MESSAGE_TEXT"

notify-pipeline-succeeded:
  stage: post
  tags: [ "arch:amd64" ]
  image: "$BUILDENV_REGISTRY/docker:24.0.4-jammy"
  when: on_success
  except:
    - schedules
    - develop
  script:
    - echo "Pipeline did succeed"

notify-nightly-failed:
  extends: .slack-notifier-base
  stage: post-nightly
  when: on_failure
  only:
    - develop
    - schedules
  script:
    - BUILD_URL="$CI_PROJECT_URL/pipelines/$CI_PIPELINE_ID"
    - 'MESSAGE_TEXT=":status_alert: $CI_PROJECT_NAME $CI_COMMIT_TAG Nightly develop pipeline <$BUILD_URL|$COMMIT_MESSAGE> failed."'
    - postmessage "#mobile-sdk-ops" "$MESSAGE_TEXT"

# Nightly

.nightly-vars:
  script:
    - vault login -method=aws -no-print
    - export DD_E2E_CLIENT_TOKEN=$(vault kv get -field=client_token kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-flutter/e2e)
    - export DD_E2E_APPLICATION_ID=$(vault kv get -field=application_id kv/aws/arn:aws:iam::486234852809:role/ci-dd-sdk-flutter/e2e)

.nightly:
  only: [ schedules ]
  when: always
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true

nightly-min-version-test:
  extends: .nightly
  stage: version-test
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-ios, script]
    - fvm install $FLUTTER_MIN_VERSION
    - fvm use $FLUTTER_MIN_VERSION
    - fvm exec dart pub global activate melos
    - export MELOS_PACKAGES="datadog_flutter_plugin"
    - fvm exec melos pub:get
    - fvm exec melos analyze:dart    
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml
  

nightly-beta-test:
  extends: .nightly
  stage: version-test
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-ios, script]
    - fvm destroy
    - fvm install beta
    - fvm use beta
    - fvm flutter upgrade --force
    - fvm flutter precache --ios
    - fvm exec dart pub global activate melos
    - pod repo update    
    - flutter doctor
    - fvm exec melos pub:get
    - fvm exec melos remove_podfile_lock --no-select
    - fvm exec melos run analyze
    - fvm exec melos run build
    - fvm exec melos run unit_test:flutter
    - fvm exec melos run unit_test:android
    - fvm exec melos run unit_test:ios
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

nightly-beta-test-web:
  extends: .nightly
  stage: version-test
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  image: $CI_IMAGE_DOCKER
  tags:
    [ "arch:amd64" ]
  script:
    - !reference [.pre, script]
    - !reference [.pre-web, script]
    - git -C "$(dirname $(dirname $(which flutter)))" reset --hard
    - flutter channel beta
    - flutter upgrade --force
    - dart pub global activate melos
    - flutter doctor
    - melos pub:get
    - melos run analyze:dart
    - melos run build:web
    - melos run unit_test:web    
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml


nightly-ios:
  extends: .nightly
  stage: e2e-test
  script:
    - !reference [.nightly-vars, script]
    - !reference [.pre, script]
    - !reference [.pre-ios, script]
    - pod repo update
    - melos pub:get
    - melos remove_podfile_lock --no-select
    - melos run e2e_tests:ios
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

nightly-android:
  extends: .nightly
  stage: e2e-test
  script:
    - !reference [.nightly-vars, script]
    - !reference [.pre, script]
    - !reference [.pre-android, script]
    - cd tools/ci && dart pub get && dart run ci_helpers start_sim --platform android --sdk $ANDROID_EMULATOR_SDK
    - melos run e2e_tests:android
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml
    paths:
      - tools/ci/logcat.txt


