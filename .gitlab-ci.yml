include:
  - 'https://gitlab-templates.ddbuild.io/slack-notifier/v3-sdm/template.yml'

variables:
  CURRENT_CI_IMAGE: "11"
  BUILD_STABLE_REGISTRY: 486234852809.dkr.ecr.us-east-1.amazonaws.com
  DISTRIBUTION_REGISTRY: registry.ddbuild.io
  # Linux CI Images
  CI_IMAGE_REPO: "ci/dd-sdk-flutter"
  CI_IMAGE_DOCKER: ${BUILD_STABLE_REGISTRY}/${CI_IMAGE_REPO}:$CURRENT_CI_IMAGE
  # Windows CI Images
  CURRENT_WINDOWS_CI_IMAGE: "1"
  WINDOWS_CI_IMAGE_DOCKER: ${DISTRIBUTION_REGISTRY}/${CI_IMAGE_REPO}:windows-$CURRENT_WINDOWS_CI_IMAGE
  DD_CLIENT_TOKEN: "fake-token"
  DD_APPLICATION_ID: "00000000-aaaa-0000-aaaa-000000000000"
  IOS_SIMULATOR: "iPhone 17 Pro"
  IOS_SDK: 'iOS-26'
  ANDROID_EMULATOR_SDK: "33"
  IS_ON_CI: $CI
  SLACK_CHANNEL: "#mobile-sdk-ops"
  FLUTTER_MIN_VERSION: '3.38.0'

  KUBERNETES_MEMORY_REQUEST: "32Gi"
  KUBERNETES_MEMORY_LIMIT: "48Gi"
  KUBERNETES_CPU_REQUEST: 4

stages:
  - ci-image
  - build
  - integration-test
  - version-test
  - e2e-test
  - prepare-release
  - post
  - release-trigger
  - post-nightly

# Prebuild - install necessary tools

.pre:
  script:
    - ulimit -S -n 2048
    - export PATH=$PATH:$HOME/.pub-cache/bin
    - flutter upgrade --force
    - flutter --version
    - flutter doctor
    # SPM is the exception, make sure its disabled before starting the build
    - flutter config --no-enable-swift-package-manager
    - dart pub global activate melos
    - dart pub global activate junitreport
    - melos bootstrap
    - mkdir -p $CI_PROJECT_DIR/.build/test-results/
    - melos full_clean
    - melos prepare
    - pushd tools/ci && dart pub get && popd

.pre-web:
  script:
    - pushd tools/ci && dart pub get && dart run ci_helpers chrome_driver --extract && popd
    - ./tools/ci/.tmp/chromedriver-linux64/chromedriver --version
    - ./tools/ci/.tmp/chrome-linux64/chrome --version
    - ./tools/ci/.tmp/chromedriver-linux64/chromedriver --port=4444 &
    - export CHROME_EXECUTABLE=${CI_PROJECT_DIR}/tools/ci/.tmp/chrome-linux64/chrome
    - export PATH="$PATH:${CI_PROJECT_DIR}/tools/ci/.tmp/chrome-linux64/"
    - echo $CHROME_EXECUTABLE
    - flutter doctor

.pre-ios:
  script:
    - xcode-select -p
    - xcodebuild -runFirstLaunch
    - xcodebuild -downloadPlatform iOS
    - pushd tools/ci && dart run ci_helpers start_sim --platform ios --sdk $IOS_SDK --device $IOS_SIMULATOR && popd

.pre-macos:
  script:
    - xcode-select -p
    - xcodebuild -runFirstLaunch

.pre-android:
  script:
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.0.0" "platform-tools" "platforms;android-36" || true
    - yes | flutter doctor --android-licenses || true
    # Kill all active emulators
    - pushd tools/ci 
    - dart pub get && dart run ci_helpers stop_emu
    - popd
    - melos pub:get
    - flutter doctor

ci-image:
  when: manual
  stage: ci-image
  except: [ tags, schedules ]
  tags: [ "arch:amd64" ]
  image: "$BUILDENV_REGISTRY/docker:24.0.4-jammy"
  script:
    - DIGEST_FILE=$(mktemp)
    - docker buildx build --tag registry.ddbuild.io/${CI_IMAGE_REPO}:${CURRENT_CI_IMAGE} --label target=build -f ci/linux/Dockerfile --push --metadata-file ${DIGEST_FILE} .
    - ddsign sign registry.ddbuild.io/${CI_IMAGE_REPO}:${CURRENT_CI_IMAGE} --docker-metadata-file ${DIGEST_FILE}

ci-image-windows:
  when: manual
  stage: ci-image
  except: [ tags, schedules ]
  tags: [ "windows-v2:2022" ]
  id_tokens:
    CI_IDENTITIES_GITLAB_ID_TOKEN:
      aud: ci-identities
  variables:
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
  script:
    - $ErrorActionPreference = "Stop"
    - $env:WINDOWS_CI_IMAGE = "${env:DISTRIBUTION_REGISTRY}/${env:CI_IMAGE_REPO}:windows-${env:CURRENT_WINDOWS_CI_IMAGE}"
    - docker build --tag ${env:WINDOWS_CI_IMAGE} --label target=build ./ci/windows
    - If ($LASTEXITCODE -ne "0") { throw "docker build returned $LASTEXITCODE" }
    - docker push ${env:WINDOWS_CI_IMAGE}
    - If ($LASTEXITCODE -ne "0") { throw "docker push returned $LASTEXITCODE" }

# Build (And Analyze) Stage

build-flutter:
  stage: build
  except: [ schedules ]
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - pushd tools/releaser && dart pub get && dart test && popd
    - melos dartfmt_check
    - melos run analyze:dart
    - melos run unit_test:flutter
    - melos run golden_test:flutter
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

build-android:
  stage: build
  except: [ schedules ]
  image: $CI_IMAGE_DOCKER
  tags: [ "arch:amd64" ]
  script:
    - !reference [.pre, script]
    - melos run analyze:android
    - melos run build:android  
    - melos run unit_test:android
    - melos run verify:jni_bindings
    
build-ios-spm:
  stage: build
  except: [ schedules ]
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-ios, script]
    - flutter config --enable-swift-package-manager    
    - melos remove_cocoapods
    - melos pub:get
    - melos run analyze:ios
    - melos run build:ios
    - melos run unit_test:ios

# dd-sdk-ios's CocoaPods podspecs don't declare macOS support (SPM-only for now), so
# macOS can only build via Swift Package Manager until that's fixed upstream.
build-macos-spm:
  stage: build
  except: [ schedules ]
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-macos, script]
    - flutter config --enable-swift-package-manager
    - melos remove_cocoapods
    - melos pub:get
    - melos run build:macos
    - melos run unit_test:macos

build-ios:
  stage: build
  except: [ schedules ]
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-ios, script]
    - pod repo update
    - melos pub:get
    - melos remove_podfile_lock --no-select
    - melos run analyze:ios
    - melos run build:ios
    - melos run unit_test:ios
    - melos run verify:ios_ffi_bindings

build-web:
  stage: build
  except: [ schedules ]
  image: $CI_IMAGE_DOCKER
  tags:
    [ "arch:amd64" ]
  script:
    - !reference [.pre, script]
    - !reference [.pre-web, script]
    - melos run build:web
    - melos run unit_test:web
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

build-linux:
  stage: build
  except: [ schedules ]
  image: $CI_IMAGE_DOCKER
  tags: [ "arch:amd64" ]
  script:
    - !reference [.pre, script]
    - melos run build:linux
    - melos run unit_test:linux
    - melos run verify:ffi_bindings
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

# Windows shell-executor runners don't support the `image:` keyword, so unlike the
# Linux jobs (build-android/build-web), the toolchain image has to be run explicitly
# via `docker run` on the bare host.
build-windows:
  stage: build
  except: [ schedules ]
  tags: [ "windows-v2:2022" ]
  variables:
    OVERRIDE_GIT_STRATEGY: clone  # Required for Windows runners
  script:
    - $ErrorActionPreference = "Stop"
    - >
      docker run --rm
      -v "$(Get-Location):C:\mnt"
      -w C:\mnt
      ${env:WINDOWS_CI_IMAGE_DOCKER}
      powershell -File C:\mnt\ci\windows\ci-build.ps1
    - If ($LASTEXITCODE -ne "0") { throw "docker run (build) returned $LASTEXITCODE" }
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

# Integration Tests

android-integration-test:
  stage: integration-test
  except: [ schedules ]
  needs: [ build-android ]
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags: 
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-android, script]
    - cd tools/ci && dart pub get && dart run ci_helpers start_sim --platform android --sdk $ANDROID_EMULATOR_SDK
    - melos run integration_test:android
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml
    paths:
      - tools/ci/logcat.txt

ios-integration-test:
  stage: integration-test
  except: [ schedules ]
  needs: [ build-ios ]
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-ios, script]
    - pod repo update
    - melos pub:get
    - melos remove_podfile_lock --no-select
    - melos run integration_test:ios
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

macos-integration-test:
  stage: integration-test
  except: [ schedules ]
  needs: [ build-macos-spm ]
  variables:
    VAULT_ADDR: "https://vault.us1.ddbuild.io"
  tags:
    - macos:sequoia
    - specific:true
  script:
    - !reference [.pre, script]
    - !reference [.pre-macos, script]
    - flutter config --enable-swift-package-manager
    - melos remove_cocoapods
    - melos pub:get
    - melos run integration_test:macos
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

web-integration-test:
  stage: integration-test
  except: [ schedules ]
  needs: [ build-web ]
  image: $CI_IMAGE_DOCKER
  tags:
    [ "arch:amd64" ]
  script:
    - !reference [.pre, script]
    - !reference [.pre-web, script]
    - ./tools/ci/.tmp/chromedriver-linux64/chromedriver --port=4444 &
    - melos run integration_test:web

linux-integration-test:
  stage: integration-test
  except: [ schedules ]
  needs: [ build-linux ]
  image: $CI_IMAGE_DOCKER
  tags:
    [ "arch:amd64" ]
  script:
    - !reference [.pre, script]
    - xvfb-run -a dbus-run-session -- melos run integration_test:linux
  artifacts:
    when: always
    expire_in: "30 days"
    reports:
      junit: $CI_PROJECT_DIR/.build/test-results/*.xml

