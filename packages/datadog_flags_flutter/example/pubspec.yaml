name: datadog_flags_flutter_example
description: Example app for the Datadog Flags Flutter integration.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  datadog_flags_flutter:
    path: ..
  datadog_flutter_plugin: ^4.0.0

dependency_overrides:
  datadog_flutter_plugin:
    path: ../../datadog_flutter_plugin/datadog_flutter_plugin
  datadog_flags:
    path: ../../datadog_flags

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  datadog_common_test:
    path: ../../datadog_common_test
  datadog_flags:
    path: ../../datadog_flags
  http: ^1.0.0
  flutter_lints: ">=1.0.0"

flutter:
  uses-material-design: true
