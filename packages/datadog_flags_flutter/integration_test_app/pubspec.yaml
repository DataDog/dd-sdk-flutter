name: datadog_flags_integration_test_app
description: Native and browser integration tests for Datadog Flags.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  datadog_flags_flutter:
    path: ..
  datadog_flutter_plugin:
    path: ../../datadog_flutter_plugin/datadog_flutter_plugin
  http: ^1.0.0
  openfeature_dart_client_sdk: ^0.0.1

dev_dependencies:
  datadog_flags:
    path: ../../datadog_flags
  datadog_common_test:
    path: ../../datadog_common_test
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
