name: datadog_session_replay
description: "Support for Flutter Session Replay in Datadog"
version: 1.1.0
homepage: https://datadoghq.com
repository: https://github.com/DataDog/dd-sdk-flutter

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ffi: ^2.1.3
  jni: ^1.0.0
  objective_c: ^9.4.1
  web: ^1.0.0
  meta: ^1.15.0  
  plugin_platform_interface: ^2.0.2
  datadog_flutter_plugin: ^3.5.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  ffigen: ^21.0.0
  jnigen: ^0.17.0
  datadog_common_test:
    path: ../datadog_common_test

flutter:
  plugin:
    platforms:
      android:
        package: com.datadoghq.flutter.sessionreplay
        pluginClass: DatadogSessionReplayPlugin
        ffiPlugin: true
      ios:
        ffiPlugin: true
        pluginClass: DatadogSessionReplayPlugin
      web:
        pluginClass: DatadogSessionReplayWeb
        fileName: src/datadog_session_replay_web.dart
