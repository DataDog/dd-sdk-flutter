import com.android.Version
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group = "com.datadoghq.datadog_session_replay"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    ext.datadog_version = "3.13.1"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def agpMajor = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
    project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
    }
    
    namespace = "com.datadoghq.datadog_session_replay"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation("com.datadoghq:dd-sdk-android-core:$datadog_version")
        // dd-sdk-android-core only declares this as a runtime dependency, so it must be
        // added explicitly to be visible on the compile classpath (needed for TimeProvider).
        implementation("com.datadoghq:dd-sdk-android-internal:$datadog_version")
        implementation("com.squareup.okhttp3:okhttp:5.3.2")
        implementation("com.google.code.gson:gson:2.12.1")

        compileOnly("com.datadoghq:dd-sdk-android-session-replay:$datadog_version")

        testImplementation("com.willowtreeapps.assertk:assertk:0.28.1")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
        testImplementation("org.junit.jupiter:junit-jupiter")
        testImplementation("com.github.xgouchet.Elmyr:core:1.3.1")
        testImplementation("com.github.xgouchet.Elmyr:junit5:1.3.1")
        testImplementation("com.github.xgouchet.Elmyr:jvm:1.3.1")
        testImplementation("io.mockk:mockk:1.14.2")
    }

    testOptions {
        unitTests.returnDefaultValues = true

        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}
