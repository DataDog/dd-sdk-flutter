import com.android.Version
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group = "com.datadoghq.datadog_session_replay"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    ext.datadog_version = "3.11.0"

    // TEMPORARY, REVERT BEFORE MERGING. The embedded-content API this plugin calls
    // (`_SessionReplayInternalProxy.setEmbeddedContentSlotId` and friends) is not in a released
    // dd-sdk-android — see https://github.com/DataDog/dd-sdk-android/pull/3690. Until it ships,
    // it comes from a locally published snapshot in `mavenLocal()`.
    // Set it to null to fall back to the released coordinate. See HYBRID_SR_LOCAL_TESTING.md.
    ext.dd_sdk_android_session_replay_version = "3.13.0-SNAPSHOT"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    // TEMPORARY, REVERT BEFORE MERGING — resolves the locally published
    // dd-sdk-android-session-replay snapshot. Added at the front rather than declared in the
    // block below because datadog_flutter_plugin contributes the Sonatype snapshots repository
    // to every project first, and that one also serves a 3.13.0-SNAPSHOT — the upstream one,
    // without the unmerged embedded-content API. See HYBRID_SR_LOCAL_TESTING.md.
    def local = repositories.mavenLocal()
    repositories.remove(local)
    repositories.add(0, local)

    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def agpMajor = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
    project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    defaultConfig {
        consumerProguardFiles 'consumer-rules.pro'
    }
    
    namespace = "com.datadoghq.datadog_session_replay"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation("com.datadoghq:dd-sdk-android-core:$datadog_version")
        // dd-sdk-android-core only declares this as a runtime dependency, so it must be
        // added explicitly to be visible on the compile classpath (needed for TimeProvider).
        implementation("com.datadoghq:dd-sdk-android-internal:$datadog_version")
        implementation("com.squareup.okhttp3:okhttp:5.3.2")
        implementation("com.google.code.gson:gson:2.12.1")

        // Only needed to reach `_SessionReplayInternalProxy`, which hands embedded records and
        // resources to the *native* Session Replay in hybrid apps. Deliberately compileOnly: an
        // app where Flutter is the host never enables native Session Replay and must not pay for
        // the module. Every call site goes through EmbeddedSessionReplay, which no-ops when the
        // class is absent at runtime.
        if (dd_sdk_android_session_replay_version) {
            // TEMPORARY, REVERT BEFORE MERGING — see the note in the buildscript block.
            compileOnly("com.datadoghq:dd-sdk-android-session-replay:$dd_sdk_android_session_replay_version")
        } else {
            compileOnly("com.datadoghq:dd-sdk-android-session-replay:$datadog_version")
        }

        // Only the Flutter embedding brings these in, and it is added compileOnly by the Flutter
        // Gradle plugin — which is non-transitive, so the host-facing extensions need them declared.
        compileOnly("androidx.annotation:annotation:1.9.1")
        // Pinned to match what flutter_embedding's consistent-resolution constraint forces on
        // debugCompileClasspath (2.7.0), not the latest available — a higher compileOnly version
        // here conflicts with that constraint and fails the build. The Lifecycle/LifecycleObserver
        // API this module actually uses is unchanged between 2.7.0 and 2.8.7.
        compileOnly("androidx.lifecycle:lifecycle-common:2.7.0")

        testImplementation("com.willowtreeapps.assertk:assertk:0.28.1")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
        testImplementation("org.junit.jupiter:junit-jupiter")
        testImplementation("com.github.xgouchet.Elmyr:core:1.3.1")
        testImplementation("com.github.xgouchet.Elmyr:junit5:1.3.1")
        testImplementation("com.github.xgouchet.Elmyr:jvm:1.3.1")
        testImplementation("io.mockk:mockk:1.14.2")
    }

    testOptions {
        // Lets tests construct types that touch the android.jar stubs incidentally — notably the
        // `Handler(Looper.getMainLooper())` default on DefaultFlutterSessionReplayFeature — instead
        // of every one of them having to inject a handler it never exercises. Tests that do depend
        // on handler behaviour still pass an explicit mock.
        unitTests.returnDefaultValues = true

        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11

        // jnigen 0.14.2 bundles kotlinx-metadata-jvm, which refuses to read the 2.2.0 `@Metadata`
        // that Kotlin 2.2 emits, so `dart run jnigen` cannot summarize this module. Pinning the
        // metadata version keeps the generated bindings buildable without holding the whole module
        // back to Kotlin 2.1; it only affects the annotation, not the bytecode.
        freeCompilerArgs.add("-Xmetadata-version=2.1.0")
    }
}

