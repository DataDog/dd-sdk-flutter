name: datadog_flutter_plugin_desktop
description: Desktop (Windows, Linux) implementation of the Datadog Flutter plugin using dart:ffi.
version: 1.0.0
repository: https://github.com/DataDog/dd-sdk-flutter

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  datadog_flutter_plugin_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=1.0.0"
  ffigen: ^12.0.0

flutter:
  plugin:
    implements: datadog_flutter_plugin
    platforms:
      windows:
        dartPluginClass: DatadogFlutterPluginDesktop
        ffiPlugin: true
      linux:
        dartPluginClass: DatadogFlutterPluginDesktop
        ffiPlugin: true
