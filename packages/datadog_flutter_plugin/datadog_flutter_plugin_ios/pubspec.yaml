name: datadog_flutter_plugin_ios
description: iOS implementation of the datadog_flutter_plugin package.
version: 1.0.0
repository: https://github.com/DataDog/dd-sdk-flutter

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  datadog_flutter_plugin_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: "^6.0.0"
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8
  datadog_common_test:
    path: ../../datadog_common_test

flutter:
  plugin:
    implements: datadog_flutter_plugin
    platforms:
      ios:
        pluginClass: DatadogSdkPlugin
        dartPluginClass: DatadogFlutterPluginIos
        sharedDarwinSource: true
      macos:
        pluginClass: DatadogSdkPlugin
        dartPluginClass: DatadogFlutterPluginIos
        sharedDarwinSource: true
