import com.android.Version
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group 'com.datadoghq.flutter.webview'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    ext.datadog_version = "3.0.0"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

def agpMajor = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
    project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    namespace "com.datadoghq.flutter.webview"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        multiDexEnabled true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation "com.datadoghq:dd-sdk-android-webview:$datadog_version"

    implementation project(":webview_flutter_android")

    testImplementation(platform("org.junit:junit-bom:5.8.2"))
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "com.github.xgouchet.Elmyr:core:1.3.1"
    testImplementation "com.github.xgouchet.Elmyr:junit5:1.3.1"
    testImplementation "io.mockk:mockk:1.13.7"
    testImplementation "com.willowtreeapps.assertk:assertk-jvm:0.25"
}

tasks.withType(Test) {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
