import com.android.Version
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

group = "com.datadoghq.flutter.inappwebviewtracking"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    // The minimum dd-sdk-android this plugin needs.
    ext.datadog_min_version = "3.0.0"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Uses the dd-sdk-android version the core plugin asks for, so every SDK module in the app shares one
// version. The constraints below keep it at least datadog_min_version.
def coreProject = rootProject.findProject(":datadog_flutter_plugin_android")
if (coreProject != null) {
    evaluationDependsOn(coreProject.path)
}
def datadog_version = coreProject?.findProperty("datadog_version") ?: datadog_min_version

// Compiles against the same dependency versions the code runs with. Without this, the runtime
// classpath can resolve a newer dd-sdk-android than the compile classpath, through the core plugin.
afterEvaluate {
    configurations.matching { it.name.endsWith("CompileClasspath") }.each { compileClasspath ->
        def runtimeClasspath = configurations.findByName(
            compileClasspath.name.replace("CompileClasspath", "RuntimeClasspath")
        )
        if (runtimeClasspath != null) {
            compileClasspath.shouldResolveConsistentlyWith(runtimeClasspath)
        }
    }
}

def agpMajor = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = agpMajor >= 9 &&
    project.findProperty('android.builtInKotlin')?.toString() != 'false'
if (!builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.datadoghq.flutter.inappwebviewtracking"
    }

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        implementation "com.datadoghq:dd-sdk-android-core:$datadog_version"
        implementation "com.datadoghq:dd-sdk-android-webview:$datadog_version"
        implementation "com.google.code.gson:gson:2.12.1"

        constraints {
            implementation("com.datadoghq:dd-sdk-android-core") { version { require(datadog_min_version) } }
            implementation("com.datadoghq:dd-sdk-android-webview") { version { require(datadog_min_version) } }
        }

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
    }
}
