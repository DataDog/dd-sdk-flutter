name: flutter_module
description: Flutter module embedded in the hybrid Session Replay example host apps.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  datadog_flutter_plugin:
    path: ../../../packages/datadog_flutter_plugin
  datadog_session_replay:
    path: ../../../packages/datadog_session_replay

dependency_overrides:
  datadog_flutter_plugin:
    path: ../../../packages/datadog_flutter_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  module:
    androidX: true
    androidPackage: com.datadoghq.flutter_module
    iosBundleIdentifier: com.datadoghq.flutterModule
