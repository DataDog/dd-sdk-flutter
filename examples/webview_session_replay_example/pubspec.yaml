name: webview_session_replay_example
description: "Shows Session Replay recording a WebView that runs the Datadog Browser SDK in a Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  datadog_flutter_plugin:
    path: ../../packages/datadog_flutter_plugin/datadog_flutter_plugin
  datadog_session_replay:
    path: ../../packages/datadog_session_replay
  datadog_webview_tracking:
    path: ../../packages/datadog_webview_tracking
  flutter_dotenv: ^5.1.0
  webview_flutter: ^4.13.1

dependency_overrides:
  datadog_flutter_plugin:
    path: ../../packages/datadog_flutter_plugin/datadog_flutter_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
