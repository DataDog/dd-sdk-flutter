name: datadog_flutter

packages:
  - packages/*
  - packages/datadog_flutter_plugin/*
  - packages/*/example
  - packages/*/integration_test_app
  - packages/*/e2e_test_app
  - packages/datadog_flutter_plugin/*/example
  - packages/datadog_flutter_plugin/*/integration_test_app
  - packages/datadog_flutter_plugin/*/e2e_test_app
  - examples/*
  - examples/native-hybrid-app/flutter_module
  - test_apps/*

scripts:
  build:
    run: melos build:ios && melos build:android && melos build:web

  build:ios:
    exec:
      concurrency: 1
    run: cd example && flutter clean && flutter build ios --release --no-codesign
    packageFilters:
      dirExists: example/ios

  # `rm` isn't a cmd.exe builtin and the Windows toolchain image doesn't provide it;
  # `del` isn't a bash command either, so try both and let the `||` fallback pick the
  # one available on the current shell.
  full_clean:
    exec:
      concurrency: 1
    run:
      flutter clean &&
      (rm pubspec.lock || del pubspec.lock)

  build:android:
    exec:
      concurrency: 1
    run: cd example && flutter build apk --release
    packageFilters:
      dirExists: example/android

  build:web:
    exec:
      concurrency: 1
    run: cd example && flutter build web
    packageFilters:
      dirExists: example/web

  build:windows:
    exec:
      concurrency: 1
    run: cd example && flutter build windows --release
    packageFilters:
      dirExists: example/windows

  build:linux:
    exec:
      concurrency: 1
    run: cd example && flutter build linux --release
    packageFilters:
      dirExists: example/linux

  dartfmt_check:
    exec: dart format --output=none --set-exit-if-changed .
  
  dartfmt:
    exec: dart format .

  lint_fix:
    run: melos lint_fix:ios && melos lint_fix:android

  lint_fix:ios:
    exec:
      concurrency: 1
    run: swiftlint --fix
    description: |
      Run swiftlint --fix
    packageFilters:
      dirExists: ios

  lint_fix:android:
    exec:
      concurrency: 1
    run:
      cd example/android 
      ./gradlew ktlintFormat
    description: |
      Run ktlintFormat
    packageFilters:
      dirExists: example/android

  analyze:
    run: melos analyze:dart && melos analyze:android && melos analyze:ios

  analyze:dart:
    exec: dart analyze .
    description: |
      Run `dart analyze` in all packages
    packageFilters:
      ignore:
        - 'stress_test'
        - 'test_app'

  analyze:android:
    exec:
      concurrency: 1
    run: |
      cd example/android
      ./gradlew --console=plain ktlintCheck detekt
    packageFilters:
      dirExists: 'example/android/buildscripts'
      ignore:
        - "*example*"
        - "*integration_test_app*"
        - "*e2e_test_app*"
  
  analyze:ios:
    exec: cd ios && swiftlint
    packageFilters:
      dirExists: ios
      ignore: 
        - "*example*"
        - "*integration_test_app*"
        - "*e2e_test_app*"

  unit_test:all:
    run: melos unit_test:flutter && melos unit_test:ios && melos unit_test:android && melos unit_test:web

  unit_test:flutter:
    run: 
      mkdir -p .build/test-results &&
      melos exec -c 1 -- "set -e -o pipefail && flutter test --machine | tojunit \"--output\" \"$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_unit.xml\"" 
    packageFilters:
      dirExists: 'test'
      ignore:
        - 'datadog_flutter_plugin_web'

  unit_test:windows:
    exec:
      concurrency: 1
    run: dart $MELOS_ROOT_PATH/tools/ci/bin/run_with_junit.dart --output $MELOS_ROOT_PATH/.build/test-results/$MELOS_PACKAGE_NAME_unit.xml -- flutter test --machine
    packageFilters:
      dirExists: 'test'
      ignore:
        - 'datadog_flutter_plugin_web'

  unit_test:linux:
    exec:
      concurrency: 1
    run: dart $MELOS_ROOT_PATH/tools/ci/bin/run_with_junit.dart --output $MELOS_ROOT_PATH/.build/test-results/$MELOS_PACKAGE_NAME_unit.xml -- flutter test --machine
    packageFilters:
      dirExists: 'test'
      ignore:
        - 'datadog_flutter_plugin_web'

  golden_test:flutter:
    exec:
      concurrency: 1
    run:
      cd example &&
      mkdir -p "$MELOS_ROOT_PATH/.build/test-results" &&
      set -e -o pipefail &&
      flutter test golden_test --machine | tojunit --output "$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_golden.xml"
    packageFilters:
      dirExists: 'example/golden_test'

  unit_test:web:
    run:
      mkdir -p $MELOS_ROOT_PATH/.build/test-results &&
      melos exec -c 1 -- "bash -c 'set -euxo pipefail; flutter test --machine --platform chrome | tojunit \"--output\" \"$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_unit_web.xml\"'"
      melos exec -c 1 -- "bash -c 'set -euxo pipefail; flutter test --machine --platform chrome --wasm | tojunit \"--output\" \"$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_unit_web_wasm.xml\"'"
    packageFilters:
      scope:
        - 'datadog_flutter_plugin'
        - 'datadog_flutter_plugin_web'

  unit_test:ios:
    exec:
      concurrency: 1
    run:
      set -euxo pipefail &&
      xcodebuild test -workspace example/ios/Runner.xcworkspace -scheme Runner -destination "platform=iOS Simulator,name=$IOS_SIMULATOR,OS=latest" | xcbeautify
    packageFilters:
      dirExists: 'example/ios'
      # TODO: These packages should probably have platform unit tests
      ignore:
        - 'datadog_inappwebview_tracking'
        - 'datadog_tracking_http_client'
        # iOS unit tests moved to datadog_flutter_plugin_ios
        - 'datadog_flutter_plugin'

  unit_test:android:
    exec:
      concurrency: 1
    run: cd example/android && ./gradlew --stacktrace --console=plain test
    packageFilters:
      dirExists: 
        - 'android'
        - 'example/android'
      ignore:        
        - 'datadog_inappwebview_tracking'

  integration_test:ios:
    run: melos integration_test:ios:main && melos integration_test:ios:other
  
  integration_test:ios:other:
    exec:
      concurrency: 1
    run: |
      mkdir -p $MELOS_ROOT_PATH/.build/test-results
      cd example

      bash -c 'set -euxo pipefail; \
      flutter test integration_test --machine -d iPhone --dart-define DD_CLIENT_TOKEN=$DD_CLIENT_TOKEN,DD_APPLICATION_ID=$DD_APPLICATION_ID \
      | tojunit "--output" "$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_ios_integration.xml"'
    packageFilters:
      dirExists:  'example/integration_test'
      ignore: 
        - 'datadog_flutter_plugin'

  # Because the main package (datadog_flutter_plugin) is set up weird for integration tests,
  # have a separate target just for it that is called by `integration_test:ios``
  integration_test:ios:main:
    exec: |
      mkdir -p $MELOS_ROOT_PATH/.build/test-results
      cd integration_test_app
      
      bash -c 'set -euxo pipefail; \
      flutter test integration_test --machine -d iPhone --dart-define DD_CLIENT_TOKEN=$DD_CLIENT_TOKEN,DD_APPLICATION_ID=$DD_APPLICATION_ID \
      | tojunit "--output" "$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_ios_integration.xml"'
    packageFilters:
      scope: 'datadog_flutter_plugin'

  integration_test:android:
    run: melos integration_test:android:main && melos integration_test:android:other

  integration_test:android:other:
    exec:
      concurrency: 1
    run: |
      mkdir -p $MELOS_ROOT_PATH/.build/test-results
      cd example

      bash -c 'set -euxo pipefail; \
      flutter test integration_test --machine -d emulator --dart-define DD_CLIENT_TOKEN=$DD_CLIENT_TOKEN,DD_APPLICATION_ID=$DD_APPLICATION_ID \
      | tojunit "--output" "$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_android_integration.xml"'
    packageFilters:
      dirExists:  'example/integration_test'
      ignore: 'datadog_flutter_plugin'

  # Because the main package (datadog_flutter_plugin) is set up weird for integration tests,
  # have a separate target just for it that is called by `integration_test:ios``
  integration_test:android:main:
    exec: | 
      mkdir -p $MELOS_ROOT_PATH/.build/test-results
      cd integration_test_app
      
      bash -c 'set -euxo pipefail; \
      flutter test integration_test --machine -d emulator --dart-define DD_CLIENT_TOKEN=$DD_CLIENT_TOKEN,DD_APPLICATION_ID=$DD_APPLICATION_ID \
      | tojunit "--output" "$MELOS_ROOT_PATH/.build/test-results/\$MELOS_PACKAGE_NAME_android_integration.xml"'
    packageFilters:
      scope: 'datadog_flutter_plugin'

  integration_test:windows:
    run: melos integration_test:windows:main && melos integration_test:windows:other

  # Desktop platforms can't run the whole integration_test directory in one `flutter test`
  # invocation, so this uses tools/ci/bin/desktop_integration_tests.dart to run each
  # test file individually, same idea as web's per-file `flutter drive` runner.
  integration_test:windows:other:
    exec:
      concurrency: 1
    run: cd example && dart $MELOS_ROOT_PATH/tools/ci/bin/desktop_integration_tests.dart --output $MELOS_ROOT_PATH/.build/test-results
    packageFilters:
      dirExists:
        - 'example/integration_test'
        - 'example/windows'
      ignore:
        - 'datadog_flutter_plugin'

  # Because the main package (datadog_flutter_plugin) is set up weird for integration tests,
  # have a separate target just for it that is called by `integration_test:windows``
  integration_test:windows:main:
    exec: cd integration_test_app && dart $MELOS_ROOT_PATH/tools/ci/bin/desktop_integration_tests.dart --output $MELOS_ROOT_PATH/.build/test-results
    packageFilters:
      scope: 'datadog_flutter_plugin'

  integration_test:linux:
    run: melos integration_test:linux:main && melos integration_test:linux:other

  # Desktop platforms can't run the whole integration_test directory in one `flutter test`
  # invocation, so this uses tools/ci/bin/desktop_integration_tests.dart to run each
  # test file individually, same idea as web's per-file `flutter drive` runner.
  integration_test:linux:other:
    exec:
      concurrency: 1
    run: |
      cd example
      dart $MELOS_ROOT_PATH/tools/ci/bin/desktop_integration_tests.dart --output $MELOS_ROOT_PATH/.build/test-results
    packageFilters:
      dirExists: 
        - 'example/integration_test'
        - 'example/linux'
      ignore:
        - 'datadog_flutter_plugin'

  # Because the main package (datadog_flutter_plugin) is set up weird for integration tests,
  # have a separate target just for it that is called by `integration_test:linux``
  integration_test:linux:main:
    exec: |
      cd integration_test_app
      dart $MELOS_ROOT_PATH/tools/ci/bin/desktop_integration_tests.dart --output $MELOS_ROOT_PATH/.build/test-results
    packageFilters:
      scope: 'datadog_flutter_plugin'

  integration_test:web:
    run: melos integration_test:web:main && melos integration_test:web:other

  integration_test:web:main:
    exec: |
      cd integration_test_app
      dart $MELOS_ROOT_PATH/tools/ci/bin/web_integration_tests.dart
    packageFilters:
      scope: 'datadog_flutter_plugin'

  integration_test:web:other:
    exec: 
      concurrency: 1
    run: |
      cd example      
      dart $MELOS_ROOT_PATH/tools/ci/bin/web_integration_tests.dart
    packageFilters:
      scope: 'datadog_tracking_http_client'

  e2e_tests:ios:
    exec: |
      mkdir -p $MELOS_ROOT_PATH/.build/test-results
      cd e2e_test_app
      
      bash -c 'set -euxo pipefail; \
      flutter test integration_test --machine -d "iPhone"'
    packageFilters:
      scope: 'datadog_flutter_plugin'

  e2e_tests:android:
    exec: |
      mkdir -p $MELOS_ROOT_PATH/.build/test-results
      cd e2e_test_app
      
      bash -c 'set -euxo pipefail; \
      flutter test integration_test --machine -d emulator'     
    packageFilters:
      scope: 'datadog_flutter_plugin'

  remove_cocoapods:
    exec: 
      concurrency: 1
    run: |
      cd example/ios
      pod deintegrate
      rm Podfile || true
      rm Podfile.lock || true
    description: |
      Remove Cocoapods support from examples.  This prevents some build failures when testing
      spm support. This change is permanent and should not be committed to source control.
    packageFilters:
      dirExists: 'example/ios'

  prepare:
    run: melos pub:get && melos generate_env && melos generate_env:e2e
    description: |
      Run `flutter pub get` on all packages and generate `.env` files for all package examples

  pub:get:
    exec:
      concurrency: 1
    run: flutter pub get

  pod_update:
    run: cd example/ios && pod update --repo-update
    exec:
      concurrency: 1
    packageFilters:
      dirExists: 'example/ios'
  
  build_runner:
    exec:
      concurrency: 1
    run: dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      dependsOn: build_runner
  
  generate_env:
    exec: dart $MELOS_ROOT_PATH/tools/ci/bin/generate_env.dart
    packageFilters:
      scope:
        - "*example*"
        - "*integration_test_app*"

  generate_env:e2e:
    exec: dart $MELOS_ROOT_PATH/tools/ci/bin/generate_env.dart --e2e
    packageFilters:
      scope:
        - "*e2e_test_app*"

  pin:ios:
    exec: 
      concurrency: 1
    run: dart $MELOS_ROOT_PATH/tools/releaser/bin/pinner.dart --platform ios --package \$MELOS_PACKAGE_PATH
    packageFilters:
      fileExists: "ios/Podfile"
  
  pin:android:
    exec: 
      concurrency: 1
    run: dart $MELOS_ROOT_PATH/tools/releaser/bin/pinner.dart --platform android --package \$MELOS_PACKAGE_PATH
    packageFilters:
      fileExists: "android/build.gradle"
