name: datadog_openfeature_conformance
description: Datadog provider tests for the upstream OpenFeature client contract.
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  datadog_flags:
    path: ../../packages/datadog_flags
  http: ^1.0.0
  openfeature_dart_client_sdk: ^0.0.1

dev_dependencies:
  build_runner: 2.15.1
  json_annotation: ^4.12.0
  json_serializable: 6.14.1
  # Keep Dart 3.10 code generation compatible with json_serializable 6.14.1.
  source_helper: '>=1.3.10 <1.4.0'
  openfeature_client_provider_contract:
    git:
      url: https://github.com/open-feature/dart-sdk.git
      ref: f8068cd5c71c6f644e1f69e171918de771e621c3
      path: conformance/client_provider_contract
  lints: ^6.1.0
  test: ^1.25.0

# The unpublished upstream harness uses a relative SDK dependency.
# Test the hosted SDK that customers receive instead of that source checkout.
dependency_overrides:
  openfeature_dart_client_sdk: 0.0.1
