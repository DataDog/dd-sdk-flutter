name: sr_models_generator
description: Generates the Dart Session Replay data models from the JSON schemas in DataDog/rum-events-format.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  args: ^2.4.0
  checked_yaml: ^2.0.3
  code_builder: ^4.12.0
  json_annotation: ^4.12.0
  meta: ^1.15.0
  path: ^1.9.0
  yaml_edit: ^2.2.4

dev_dependencies:
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  lints: ^6.1.0
  test: ^1.25.0
