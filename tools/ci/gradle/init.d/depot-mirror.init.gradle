import org.gradle.api.initialization.resolve.RepositoriesMode
import org.gradle.api.artifacts.repositories.MavenArtifactRepository

// Routes Gradle plugin and dependency resolution through Datadog's internal
// Depot mirror during CI. Only installed into $GRADLE_USER_HOME/init.d/ by CI
// (see .gitlab-ci.yml) — never touches files that ship with the published
// packages.
//
// Adding the proxy to dependencyResolutionManagement.repositories (a
// settings-level container) rather than unconditionally to
// allprojects.repositories is what makes this compatible with settings
// files that declare
// `repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS` — notably the
// Flutter SDK's own flutter_tools/gradle included build, used to resolve the
// dev.flutter.flutter-plugin-loader plugin. Adding a repo at the project
// level there throws "Build was configured to prefer settings repositories
// over project repositories...".
def proxyUrl = System.getenv('DEPOT_JAVA_MAVEN_URL')

if (proxyUrl) {
    // Dynamic selectors make Gradle inspect metadata in every eligible
    // repository. Adding Depot first is therefore insufficient: a later
    // google() or mavenCentral() declaration can still make the build contact
    // the public upstream and fail with a 429. Disable all content on those
    // direct repositories so their declarations remain harmless and Depot is
    // the only eligible source for artifacts routed through those upstreams.
    // configureEach also covers repositories declared after this init script.
    def disableDirectMirroredRepositories = { repositories ->
        repositories.configureEach { repository ->
            if (repository instanceof MavenArtifactRepository &&
                repository.url.host in [
                    'dl.google.com',
                    'maven.google.com',
                    'repo.maven.apache.org',
                    'repo1.maven.org'
                ]) {
                repository.content {
                    excludeGroupByRegex('.*')
                }
            }
        }
    }

    // Reset per Settings instance this init script is applied against — the
    // root build and each includeBuild() participant get their own
    // evaluation of this file, so this doesn't leak state between them.
    def repositoriesCentralized = false

    beforeSettings { settings ->
        // Plugin resolution: the `plugins { ... }` block in settings.gradle,
        // normally served by google() / gradlePluginPortal(). pluginManagement
        // has no FAIL_ON_PROJECT_REPOS-equivalent mode, so adding here is
        // always safe.
        //
        // gradlePluginPortal() must be re-added explicitly alongside the
        // proxy: if a settings file declares no pluginManagement repositories
        // of its own, Gradle implicitly falls back to the plugin portal —
        // but that implicit fallback disables itself the moment *anything*
        // is added to the container, leaving only our proxy with no route to
        // whatever Depot hasn't mirrored yet.
        settings.pluginManagement {
            repositories {
                disableDirectMirroredRepositories(delegate)
                maven { url = proxyUrl }
                gradlePluginPortal()
            }
        }
        // The blessed place to add a settings-level repo for regular
        // dependency resolution — safe whether or not the project also sets
        // FAIL_ON_PROJECT_REPOS below.
        settings.dependencyResolutionManagement {
            repositories {
                disableDirectMirroredRepositories(delegate)
                maven { url = proxyUrl }
            }
        }
    }

    // beforeSettings runs before the settings script body, so a project's own
    // repositoriesMode.set(FAIL_ON_PROJECT_REPOS) call (if any) isn't visible
    // yet at that point. settingsEvaluated runs after, once it is.
    settingsEvaluated { settings ->
        repositoriesCentralized =
            settings.dependencyResolutionManagement.repositoriesMode.orNull == RepositoriesMode.FAIL_ON_PROJECT_REPOS
    }

    allprojects {
        // Legacy buildscript {} classpath resolution (old-style root
        // build.gradle, still used by several packages/examples here) isn't
        // covered by dependencyResolutionManagement at all, so it always
        // needs the proxy added directly.
        buildscript {
            repositories {
                disableDirectMirroredRepositories(delegate)
                maven { url = proxyUrl }
            }
        }

        // Skip projects governed by FAIL_ON_PROJECT_REPOS: the
        // dependencyResolutionManagement block above already covers them,
        // and declaring a repository here too would violate that mode.
        if (!repositoriesCentralized) {
            repositories {
                disableDirectMirroredRepositories(delegate)
                maven { url = proxyUrl }
            }
        }
    }
}

// TEMP DEBUG — remove once we've confirmed whether Depot is actually being
// queried in real CI. Dumps the env var and effective repo list for
// :integration_test so we can see this in the job trace directly.
println "TEMP DEBUG: DEPOT_JAVA_MAVEN_URL=${System.getenv('DEPOT_JAVA_MAVEN_URL')}"
gradle.projectsEvaluated {
    rootProject.allprojects { p ->
        if (p.name == 'integration_test') {
            println "TEMP DEBUG: repo order for ${p.path}:"
            p.repositories.each { r ->
                try { println "TEMP DEBUG:   - ${r.name}: ${r.url}" } catch (e) { println "TEMP DEBUG:   - ${r.name}" }
            }
        }
    }
}
