name: datadog_android_workspace
description: Internal Flutter host for Android plugin development.
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  datadog_flutter_plugin_android:
    path: ../../packages/datadog_flutter_plugin/datadog_flutter_plugin_android
  datadog_session_replay:
    path: ../../packages/datadog_session_replay
  datadog_webview_tracking:
    path: ../../packages/datadog_webview_tracking
  datadog_inappwebview_tracking:
    path: ../../packages/datadog_inappwebview_tracking

dev_dependencies:
  flutter_lints: '>=6.0.0'
